name: Authenticated regression evidence
on:
  push:
    branches: [main, codex/patchjury-review-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-evidence:
    name: PatchJury regression evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture actual regression output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .patchjury-output
          timeout 60s docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --user 65534:65534 --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" --tmpfs /tmp:rw,noexec,nosuid,size=16m --workdir /work python:3.12-slim python -B examples/review-ready/test_retry.py | tee .patchjury-output/actual-report.txt
          cmp examples/review-ready/test-report.txt .patchjury-output/actual-report.txt
      - name: Bind actual output to this run check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-ci-evidence.mjs
